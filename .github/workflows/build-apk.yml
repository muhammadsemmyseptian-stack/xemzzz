name: Build Semmy Gold APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Reassemble compressed Android source
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 6000 source-payload/part-01.txt
            cat source-payload/part-02.txt
            cat source-payload/part-03.txt
            cat source-payload/part-04.txt
            cat source-payload/part-05.txt
            head -c 3000 source-payload/part-06.txt
            cat source-payload/part-06-tail.txt
          } > source.b64
          echo "44c9d285b2d402585b271d5e52febefb7b01de13ccf378aa78c3e3bb05354d83  source.b64" | sha256sum -c -
          base64 --decode source.b64 | tar -xz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          rm source.b64
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          debug_config = '''    create("debugConfig") {
            storeFile = file("${rootDir}/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
          }
          '''
          if debug_config not in s:
              raise SystemExit("Expected debugConfig signing block not found")
          s = s.replace(debug_config, "")
          debug_block = '''    debug {
            // Do not remove or modify this signingConfig assignment. It is necessary for Android apps in
            // AI Studio.
            signingConfig = signingConfigs.getByName("debugConfig")
          }
          '''
          if debug_block not in s:
              raise SystemExit("Expected debug build signing block not found")
          s = s.replace(debug_block, "")
          p.write_text(s)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: semmy-gold-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
