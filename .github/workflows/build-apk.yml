name: Build Semmy Gold APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Reassemble compressed Android source
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 6000 source-payload/part-01.txt
            cat source-payload/part-02.txt
            cat source-payload/part-03.txt
            cat source-payload/part-04.txt
            cat source-payload/part-05.txt
            head -c 3000 source-payload/part-06.txt
            cat source-payload/part-06-tail.txt
          } > source.b64
          echo "44c9d285b2d402585b271d5e52febefb7b01de13ccf378aa78c3e3bb05354d83  source.b64" | sha256sum -c -
          base64 --decode source.b64 | tar -xz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          rm source.b64
          cat source-overrides-payload/part-01.b64 source-overrides-payload/part-02.b64 source-overrides-payload/part-03.b64 source-overrides-payload/part-04.b64 source-overrides-payload/part-05.b64 > source-overrides.b64
          base64 --decode source-overrides.b64 > source-overrides.tar.gz
          echo "a84c122ed68a11ce4a272f52b121295087b0c958c3912831c9ca8778cffbaeaa  source-overrides.tar.gz" | sha256sum -c -
          tar -xzf source-overrides.tar.gz
          rm source-overrides.b64 source-overrides.tar.gz

      - name: Apply 1 percent default risk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          specs = Path("app/src/main/java/com/example/model/TradingCalculation.kt")
          text = specs.read_text()
          old = "const val RISK_PERCENT = 10.0 // 10%"
          if old not in text:
              raise SystemExit("Expected risk default not found; refusing an unsafe blind edit.")
          specs.write_text(text.replace(old, "const val RISK_PERCENT = 1.0 // 1% default; editable by user"))

          vm = Path("app/src/main/java/com/example/viewmodel/GoldCalculatorViewModel.kt")
          text = vm.read_text()
          text = text.replace('riskPercentInput: String = "10"', 'riskPercentInput: String = "1"')
          text = text.replace("calculatePosition(10000.0, 60.0, 10.0, 3.0)", "calculatePosition(10000.0, 60.0, 1.0, 3.0)")
          vm.write_text(text)

          tests = Path("app/src/test/java/com/example/TradingCalculationTest.kt")
          text = tests.read_text()
          text = text.replace("calculatePosition(balance, slPips)", "calculatePosition(balance, slPips, 10.0, 3.0)")
          text = text.replace("calculatePosition(5000.0, 80.0)", "calculatePosition(5000.0, 80.0, 10.0, 3.0)")
          text = text.replace("calculatePosition(50.0, 60.0)", "calculatePosition(50.0, 60.0, 10.0, 3.0)")
          text = text.replace("calculatePosition(2000000.0, 30.0)", "calculatePosition(2000000.0, 30.0, 10.0, 3.0)")
          tests.write_text(text)

          new_test = Path("app/src/test/java/com/example/DefaultRiskTest.kt")
          new_test.write_text("""package com.example

import com.example.model.calculatePosition
import org.junit.Assert.assertEquals
import org.junit.Assert.assertTrue
import org.junit.Test

class DefaultRiskTest {
    @Test
    fun defaultRiskIsOnePercentAndKeepsRiskBelowBudget() {
        val result = calculatePosition(10000.0, 60.0)
        assertTrue(result.isValid)
        assertEquals(1.0, result.riskPercent, 0.001)
        assertEquals(100.0, result.riskAmountUsc, 0.001)
        assertEquals(0.16, result.recommendedLotSize, 0.001)
        assertEquals(96.0, result.potentialLossUsc, 0.001)
    }
}
""")

          readme = Path("README.md")
          text = readme.read_text().replace("- Risk: fixed 10% of balance.", "- Risk: default 1% of balance; editable in the calculator (up to the app's validated limit).")
          readme.write_text(text)
          PY

      - name: Print Kotlin source for implementation review
        shell: bash
        run: |
          set -euo pipefail
          find app/src -type f -name '*.kt' -print | sort
          while IFS= read -r file; do
            echo "===== SOURCE FILE: $file ====="
            cat "$file"
          done < <(find app/src -type f -name '*.kt' -print | sort)

      - name: Upload unpacked source for implementation review
        uses: actions/upload-artifact@v4
        with:
          name: semmy-gold-calculator-source
          path: |
            app/src/**
            app/build.gradle.kts
            gradle/**
            settings.gradle.kts
            build.gradle.kts
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: semmy-gold-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
